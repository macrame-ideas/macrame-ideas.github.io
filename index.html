const posts = [
  {
    "id": "ivory-diamond-macrame-wall-hanging",
    "title": "Ivory Diamond Macrame Wall Hanging",
    "date": "September 12, 2026",
    "category": "Wall decor",
    "level": "A little practice",
    "time": "A slow afternoon",
    "image": "./assets/Ivory Diamond Macrame Wall Hanging.png",
    "alt": "Ivory cotton wall hanging with diamond knot details and long fringe on a wooden dowel.",
    "excerpt": "Bring a little handmade calm to your walls with ivory cord, diamond details, and soft flowing fringe. 🧶\n• Practice one small diamond before starting the full hanging.\n• Comb the fringe gently for an airy finish.\nA lovely project for a quiet creative afternoon. #MacrameWallHanging #MacrameDIY #BohoDecor\nSave for later!",
    "content": "<p>A beautiful macrame wall hanging does not need a crowded pattern or a room full of accessories. Ivory cotton, a simple wooden dowel, and a few well-spaced diamonds can create a focal point that feels soft and considered. The appeal is in the contrast: structured knots at the top, generous loose fringe below, and natural wood holding everything together.</p><p>This diamond macrame wall hanging is a lovely direction for makers who enjoy a slower project. You can start with a small sample, learn how the cords behave, and build toward a piece that suits your own wall. Think of the design as inspiration rather than a counted pattern. The exact cord lengths and knot arrangement will depend on your chosen dimensions and materials.</p><div style=\"background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Key Takeaways</h3><ul style=\"margin:0;padding-left:20px;\"><li>Use ivory cotton and natural wood for a quiet, textured palette.</li><li>Practice square knots and diagonal double half hitches separately.</li><li>Estimate cutting lengths from a sample in your actual cord.</li><li>Check symmetry as each band is completed.</li><li>Leave final fringe trimming until the hanging has settled.</li></ul></div><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">What makes this wall hanging work</h2><p>The ivory color lets the texture do most of the decorating. Knots catch the light differently from loose strands, so even a single-color hanging has depth. Against a warm cream wall, the effect is gentle rather than stark. A pale wood dowel adds another natural surface without competing with the cotton.</p><p>Diamond motifs give the eye somewhere to travel. They can be outlined with diagonal double half hitches, filled with small groups of square knots, or separated by open spaces. The finished inspiration combines geometric structure with a relaxed lower edge. You do not need to reproduce every intersection to achieve that balance.</p><p>Long fringe matters as much as the knotted section. If the entire piece is tightly packed, it can look heavy. Leaving a generous area of free cord allows the hanging to feel light and tactile. Decide early whether you prefer a straight fringe, a shallow V, or a softly stepped outline.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Choose a scale that suits your room</h3><p>Before buying cord, cut a piece of paper roughly the size of the hanging you imagine. Tape it temporarily to the wall and step back. A project that looks large on your craft table can disappear over a wide cabinet. Conversely, an oversized fringe can crowd a small reading corner.</p><p>Measure the dowel width separately from the woven width. A little exposed wood at each end gives the piece breathing room and makes the suspension easier to arrange. Keep enough clear space below for the fringe to hang freely instead of resting on furniture or brushing nearby objects.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Gather a simple set of materials</h2><ul><li>Cotton macrame cord in one consistent thickness and color.</li><li>A smooth wooden dowel or clean, dry branch without sharp edges.</li><li>Sharp scissors, a tape measure, and a removable marking tool.</li><li>A sturdy temporary support for the dowel while you work.</li><li>A wide-tooth comb for loose fringe, if your cord can be brushed.</li><li>A small notebook for your sample measurements and knot layout.</li></ul><p>Single-twist cotton is often chosen for soft fringe because its fibers separate readily. Plied cord can give knots a more defined appearance, though brushing it requires untwisting the strands first. Braided cord produces a different finish and usually will not turn into the same fluffy fringe. Choose for the look you want, not just the color.</p><p>Cord thickness affects both appearance and consumption. Thicker cotton makes a bold pattern with fewer knots across the dowel; finer cord gives more detail but takes longer to work. If you substitute a different cord into a tutorial, expect to adjust the number of strands and the finished dimensions.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Plan cord lengths with a sample</h3><p>There is no reliable way to calculate an exact cutting list from a decorative photograph alone. Make a sample using the same cord and knots you plan to repeat. Measure a strand before knotting, then measure how much length is consumed by a short section. Include the folded mounting loop and the desired fringe when estimating your full lengths.</p><p>Working cords often shorten faster than filler cords. Diagonal rows also redistribute which strands do the work. Allow room for this uneven consumption, and cut conservatively until you understand the pattern. A little extra fringe is easier to manage than a working cord that runs out halfway through a diamond.</p><p style=\"background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;\"><strong>Maker tip:</strong> Keep your sample attached to a small spare dowel. It becomes a tension reference you can compare with the main hanging whenever your knots begin to tighten or spread out.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Learn the knots before combining them</h2><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Mount the cords with lark's head knots</h3><p>Fold a cord in half and place the folded loop around the dowel. Pass the two loose ends through the loop and pull them down evenly. The knot should sit securely without being crushed against its neighbors. Repeat with the remaining cords, then spread the mounting knots to the width you planned.</p><p>Each folded cord gives you two hanging ends. Because a basic square knot uses four ends, planning in groups that support your chosen repeat helps avoid an awkward edge. Count the hanging ends before beginning. If you move mounting knots later, make sure their spacing still looks intentional.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Practice a balanced square knot</h3><p>Work with four ends: two outer working cords and two inner filler cords. Pass the left outer cord across the front of the fillers and under the right outer cord. Bring the right outer cord behind the fillers and through the loop on the left. Tighten this first half gently.</p><p>Reverse the movement for the second half, beginning from the right. Together, the two opposite halves form a square knot. Repeating the same half instead produces a twisting spiral, which is useful elsewhere but changes the look of a flat wall hanging. Check both halves before tightening the knot into position.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Shape diagonal lines slowly</h3><p>A diagonal double half hitch uses one cord as a guide while adjacent cords wrap around it. Hold the guide at the intended angle and make two half hitches with each working cord in turn. The guide establishes the slope. Pulling it into a new direction halfway through can bend the line unexpectedly.</p><p>Practice this movement on scrap cord before outlining a large diamond. A clean diagonal is usually the result of consistent direction and pressure, not maximum tightness. If a section looks lumpy, loosen a few knots and rebuild it while keeping the guide cord steady.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Build a layout that feels balanced</h2><p>Begin with a modest band of square knots below the dowel. This gives the upper section structure and helps you establish even spacing. Work across in complete rows rather than finishing one side from top to bottom. Comparing left and right as you go makes uneven tension easier to spot.</p><p>For alternating square knots, the next row borrows strands from neighboring groups. Set aside the appropriate outside ends so the new groups sit between the previous knots. Keep the vertical gap consistent. You can use a narrow strip of cardboard as a temporary spacing guide, removing it after the row is finished.</p><h4 style=\"font-size:20px;line-height:1.4;margin:22px 0 12px;color:#334155;font-weight:700;background:#f8fafc;padding:10px 14px;border-radius:8px;\">Make one diamond your starting point</h4><p>Place a small diamond near the center of the hanging and build outward. Outline it with diagonal rows, or use a simpler stepped arrangement of square knots if you are still learning. Give each repeat enough room that the shape remains readable when viewed from across the room.</p><p>Do not force a complicated photographed motif into an untested cord count. Sketch a simpler version, knot it as a sample, and use that repeat consistently. A restrained pattern with tidy joins is more satisfying than several intricate sections that do not align with one another.</p><div style=\"background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Why This Matters</h3><ul style=\"margin:0;padding-left:20px;\"><li>Spacing is part of the design: open areas make the diamonds easier to read.</li><li>A repeated simple motif can look more polished than an overcrowded pattern.</li></ul></div><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Check the shape before adding more rows</h3><p>Pause after each major band and let the piece hang naturally. Look at it from several steps away. The center should feel centered, the sides should fall without pulling inward, and the dowel should sit level. Small irregularities are normal in handmade work; a repeated slant usually signals a tension issue worth correcting.</p><p>Photograph the work straight on if you find it difficult to judge. A quick photo can make a drifting diamond or uneven outer border easier to notice. Adjust while the relevant knots are still accessible. It is much simpler to undo three knots now than several completed rows later.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Finish the fringe without rushing</h2><p>Let the hanging rest before making the final cut. Cotton can settle after handling, and tightly bundled strands may need time to relax. Decide on the shortest finished point first, then leave a little extra length below it for the initial trim. You can refine the outline afterward.</p><p>Work on a protected flat surface. Separate any plied cord gently, then comb from the tips upward in short sections. Starting at the knot line and dragging downward can pull on the structure or create tangles. Support the fibers with your free hand and stop if the cord begins to shed excessively.</p><p style=\"background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;\"><strong>Maker tip:</strong> Trim less than you think you need. Hang the piece, check the silhouette, and make a second light pass. Repeatedly cutting to correct one uneven strand can shrink the entire fringe surprisingly quickly.</p><p>A straight edge gives a clean, contemporary finish. A shallow V echoes diamond shapes higher up. Either can work beautifully, but choose one clear outline. Randomly varying lengths may look unfinished unless the whole design deliberately uses an organic edge.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Style your handmade piece</h2><p>The warm ivory palette pairs naturally with terracotta, pale timber, linen, and muted greens. A single ceramic vase below the hanging can be enough. Leave some unoccupied wall around it so the fringe and knotwork remain the focus instead of competing with shelves and framed prints.</p><p>Side light highlights texture especially well. Try a position that receives gentle daylight, avoiding a damp location where cotton may stay wet. Use mounting hardware suitable for the wall and the completed piece. Keep long cords away from places where children or pets might tug or become entangled.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Care and small repairs</h3><p>Dust lightly with a soft brush or use a gentle vacuum setting through a protective mesh, keeping the nozzle from pulling loose fibers. Follow the cord supplier's cleaning guidance. If a spot needs attention, test a hidden area first and avoid saturating the wood or the entire knotted section unnecessarily.</p><p>If fringe becomes messy, use your fingers before reaching for the comb. A mounting loop that slips can often be repositioned without undoing the design. If one knot loosens, trace its path and retighten it carefully rather than pulling every nearby strand at once.</p><div style=\"background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">At a Glance</h3><ul style=\"margin:0;padding-left:20px;\"><li>Sample first, then measure.</li><li>Work across the hanging in balanced rows.</li><li>Comb from the ends upward.</li><li>Trim gradually and check on the wall.</li></ul></div><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Make space for a slower kind of decorating</h2><p>An ivory diamond macrame wall hanging brings interest through texture rather than bright color. Start with a manageable scale, practice your main knots, and build a layout that gives the cotton room to breathe. The most useful investment is the small sample that teaches you how your materials behave.</p><p>Give the finishing stage the same attention as the knotting. A balanced dowel, a calm geometric rhythm, and a thoughtfully trimmed fringe make even a simple design feel complete. Choose your wall, gather your cord, and enjoy turning an ordinary afternoon into something you can live with for years.</p><div style=\"margin-top:28px;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Tags</h3><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Macrame Wall Hanging</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Diamond Macrame</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">DIY Wall Decor</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Cotton Cord</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Boho Decor</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Square Knots</span></div>"

    "id": "cotton-macrame-plant-hanger",
    "title": "Cotton Macrame Plant Hanger",
    "date": "August 24, 2026",
    "category": "Plant hangers",
    "level": "A little practice",
    "time": "An afternoon project",
    "image": "./assets/Cotton Macrame Plant Hanger.png",
    "alt": "Ivory macrame plant hanger with a wooden ring, terracotta pot, trailing green leaves and a long tassel.",
    "excerpt": "Give your favorite trailing plant a handmade home with soft cotton knots and a warm terracotta pot. 🌿\n• Fit the cradle around your actual pot as you work.\n• Let the plant drain before returning it to the hanger.\nAn inviting way to add greenery without filling another shelf. #MacramePlantHanger #IndoorJungle #DIYCrafts\nSave for later!",
    "content": "<p>A trailing plant in a cotton macrame hanger can turn an overlooked corner into one of the most welcoming spots in a room. Soft ivory cords frame the foliage, a terracotta pot adds warmth, and a wooden ring keeps the whole arrangement visually simple. The long tassel below the pot gives the design a relaxed, handmade finish.</p><p>The best version of this project begins with the pot rather than a fixed knot count. Its width, shape, and weight determine how the cradle should fit. This guide explores the design and the decisions behind a practical hanger, with a straightforward knotting approach you can adapt. For a first load-bearing project, use a tested pattern with materials appropriate to the pot you intend to hang.</p><div style=\"background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Key Takeaways</h3><ul style=\"margin:0;padding-left:20px;\"><li>Choose the pot before deciding the cradle dimensions.</li><li>Account for the full watered weight when selecting support materials.</li><li>Keep the arms equal and check spacing as you work.</li><li>Connect neighboring arms into a secure, fitted cradle.</li><li>Plan an easy way to water and drain the plant.</li></ul></div><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Why cotton and terracotta work together</h2><p>The pale cord creates a gentle outline around the pot without hiding its surface. That open structure is part of the appeal of a macrame plant hanger: you can still see the container, while the repeated knots make the support feel decorative. Green leaves break up the vertical lines and soften the silhouette.</p><p>Terracotta brings a matte, earthy finish that pairs well with cotton and wood. You can echo that warmth elsewhere with a small ceramic dish or a linen cushion, but the hanger does not need a full matching room. One clear combination of natural textures is enough to make it feel intentional.</p><p>The wooden ring gives the top a defined starting point. Below it, spaced knots add interest along the arms before they join into the cradle. The inspiration includes plenty of open cord, which helps a leafy plant remain the focal point rather than disappearing inside a dense net.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Start with the location</h3><p>Choose a position where the plant can receive the light it needs and where you can reach the pot comfortably. A dramatic corner is less useful if watering requires moving furniture every week. Allow room for trailing stems to grow without brushing a walkway, a hot surface, or a frequently opened door.</p><p>Look at the entire drop from the ceiling or wall support to the lowest tassel. The plant itself may extend farther than the cord. Mark the approximate pot position with a piece of string before you begin knotting. This quick check helps avoid making a hanger that is beautiful but impractical for its intended spot.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Select the pot and materials</h2><ul><li>A small, stable pot with a shape the cradle can grip securely.</li><li>Cotton cord suitable for the tested hanger pattern you choose.</li><li>A sound hanging ring intended for the finished load.</li><li>A tape measure and sharp scissors.</li><li>Extra cord for gathering knots, if the pattern uses them.</li><li>Mounting hardware selected for the wall or ceiling structure.</li></ul><p>Do not judge the load by an empty pot. Include the plant, container, soil, and water retained after watering. Decorative rings and hooks are not automatically suitable for that weight. Follow the stated limits for each component and the mounting instructions for the surface where it will be installed.</p><p>Inspect the pot's shape as well. A straight-sided container behaves differently from one that narrows sharply toward the base. A very shallow bowl may need a different cradle entirely. The cords should support the container around several sides, with the lower gathering point positioned beneath its base rather than halfway up the pot.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Think through drainage before knotting</h3><p>A drainage hole is helpful for many houseplants, but water should not drip onto the floor or remain trapped in the cord. One option is to remove the inner nursery pot for watering and let it drain fully before returning it to a suitable outer container. Another is to remove the entire pot from the hanger when practical.</p><p>Choose the watering arrangement that fits both your plant and your container. Check for standing water rather than assuming it has evaporated. A damp cotton cradle can stain and deteriorate, and a wet terracotta surface can mark pale fibers. Good access makes regular inspection much easier.</p><p style=\"background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;\"><strong>Maker tip:</strong> Fit and test the hanger close to a protected floor before placing it overhead. If the pot tilts, slides, or pushes through an opening, adjust the cradle instead of relying on the tassel to keep it in place.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Understand the basic structure</h2><p>A simple plant hanger can be divided into four sections: the ring attachment, the hanging arms, the cradle, and the finishing tail. Planning them separately makes the project less confusing. You can change the decorative knots on the arms while keeping the cradle dimensions tied to the pot.</p><p>Many square-knot designs use four arms with four hanging ends in each arm. That arrangement commonly starts with eight long cords folded over a ring, giving sixteen ends. It is an example of a useful structure, not a universal cutting plan. Your tested pattern may use another count or a different attachment method.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Sample before cutting all the cord</h3><p>Square knots consume the outer working cords faster than the inner filler cords. Spiral sections can consume substantial length too. Make a short sample with the intended material and measure before and after knotting. Use those measurements alongside your pattern to estimate lengths, allowing for the ring attachment, cradle, and tassel.</p><p>Leave the final trimming until the pot is fitted. Long working ends can be bundled loosely to keep them from tangling while you knot. Avoid tight temporary wraps that make the cord kink. Labeling the bundles or laying them in separate groups can also make it easier to keep the arms organized.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Make the arms even</h2><p>Attach the prepared cords to the ring according to your pattern and divide them into equal groups. Suspend the ring from a stable working support. The ring should remain in one place as you pull the knots; if it swings or shifts, it is harder to compare the arm lengths accurately.</p><p>Work the same decorative sequence on each arm. A small group of square knots, a measured open gap, and another group can create an airy result. Complete one matching section on all arms before moving down to the next. This reduces the chance of forgetting a spacing measurement halfway through the project.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Square knots or spirals</h3><p>A square knot uses two opposite half knots around a pair of filler cords. Alternating the starting side keeps the section flat. A spiral uses repeated half knots from the same side, allowing the cord to turn as the sequence grows. Both can look attractive, but they shorten differently and should not be swapped without checking the resulting length.</p><p>Use a ruler or a simple cardboard spacer for open gaps. Measure from the same reference point on every arm, such as the bottom edge of the previous knot. If you measure one arm from the top of a knot and another from the bottom, the difference can become noticeable around the pot.</p><h4 style=\"font-size:20px;line-height:1.4;margin:22px 0 12px;color:#334155;font-weight:700;background:#f8fafc;padding:10px 14px;border-radius:8px;\">Keep tension comfortable</h4><p>Firm, even knots are more helpful than knots pulled as hard as possible. Excessive force can distort the fibers and make later adjustments difficult. Let the arm hang after each section, compare it with the others, and loosen any knot that has noticeably changed the length before you continue.</p><div style=\"background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Why This Matters</h3><ul style=\"margin:0;padding-left:20px;\"><li>The pot determines the net: decorative spacing should follow the container shape.</li><li>A hanger that is easy to remove makes plant care and cord inspection simpler.</li></ul></div><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Form a cradle around the actual pot</h2><p>The cradle begins where neighboring arms connect. In a common square-knot arrangement, two ends from one arm join two ends from the next. These new groups create the first row of the net. Continue around the circumference so that the last arm connects back to the first rather than leaving an open side.</p><p>Hold the empty pot in position while checking where that row sits. The openings should frame the pot while preventing it from slipping between the arms. Keep the rim accessible so you can remove the container for care. Move the pot gently in different directions to see whether the net stays evenly distributed.</p><p>A second staggered row can narrow the openings toward the base, depending on the chosen pattern and pot shape. The distance between rows changes the size of the diamonds in the net. Large gaps may look elegant, but they are not useful if the pot can pass through them.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Gather the cords below the base</h3><p>Once the cradle fits, bring the cords together beneath the pot. Use the secure finishing method specified by your pattern. A gathering knot typically wraps a separate cord around the bundle and draws the working end beneath those wraps. Its placement matters: too high and the pot may sit unevenly; too low and the cradle may be loose.</p><p>Do not trim the tails immediately after making the wrap. Check that the finish holds, the strands remain organized, and the pot sits level. Decorative glue should not substitute for a properly formed load-bearing structure. If the design needs extra support to work, revisit the pattern and materials.</p><p style=\"background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;\"><strong>Maker tip:</strong> The ring, knots, cord, hook, and mounting surface all contribute to the support. A strong cord does not compensate for an unsuitable ceiling anchor or a cracked decorative ring.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Finish the tassel and check the balance</h2><p>An unbrushed tassel shows the individual strands and echoes the cords above. A combed tassel looks softer and fuller. Either can suit the ivory-and-terracotta palette. Keep it proportional to the whole hanger so it finishes the design without becoming the longest or busiest element.</p><p>For a brushed finish, separate the fibers gradually and comb from the ends upward. Support the gathering knot as you work. Trim a little at a time, then let the hanger hang freely before checking the line again. The pot's weight may change how the cords settle, so the final inspection should include the fitted container.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Style the greenery with room to grow</h2><p>Trailing foliage works especially well because it moves across the geometric cord structure. Guide stems gently around the arms instead of forcing them through tight openings. Leave new growth room to extend. If a stem becomes woven through several knots, removing the pot for watering can become unnecessarily difficult.</p><p>Choose the plant for the available light and your household, then enjoy the decorative effect. The photographed foliage suggests a pothos-style trailing plant, but the same visual idea can be adapted to other suitable plants. Check species-specific care and household suitability before selecting one, particularly where pets may reach the leaves.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Avoid overcrowding the corner</h3><p>One hanger can make a stronger statement than several squeezed together. Leave visible wall between the foliage and nearby artwork. A warm neutral background shows the cotton clearly, while a darker background can make the pale knotwork feel more graphic. Test the placement in daylight and in the evening before settling on it.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Care for the hanger as well as the plant</h2><p>Inspect the ring, attachment, knots, and cradle periodically, especially after repotting or moving the hanger. A larger pot or wetter soil can change the load. If cords become frayed, persistently damp, discolored, or loose, take the hanger down and address the cause before using it again.</p><p>Remove dust with a soft brush and follow the cord manufacturer's cleaning advice. Avoid soaking a wooden ring unnecessarily. If you wash a removable textile hanger, let it dry completely and recheck its fit before returning the plant. Cotton can change shape with washing, and a previously snug cradle may need adjustment.</p><div style=\"background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">At a Glance</h3><ul style=\"margin:0;padding-left:20px;\"><li>Measure from consistent knot reference points.</li><li>Test the fit near the floor.</li><li>Keep cotton from staying wet.</li><li>Recheck the support after repotting.</li></ul></div><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Create a plant corner you can enjoy every day</h2><p>A cotton macrame plant hanger combines a satisfying craft project with a useful way to display greenery. The ivory cord, natural ring, terracotta container, and trailing leaves create interest through texture and shape. Thoughtful spacing allows each part to be seen without making the arrangement feel busy.</p><p>Begin with your pot, choose a suitable tested structure, and check the fit throughout the process. Even arms and a secure cradle matter more than adding extra decorative knots. Finish with a tidy tassel, choose an accessible location, and give both the plant and its handmade support the care they need.</p><div style=\"margin-top:28px;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Tags</h3><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Macrame Plant Hanger</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Cotton Macrame</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Indoor Plants</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Terracotta Pot</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">DIY Plant Decor</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Boho Home</span></div>"

    "excerpt": "Small project, lovely everyday texture. These square macrame coasters pair a neat knot grid with playful ivory fringe. ☕\n• Keep the center flat so your cup sits steadily.\n• Use one finished coaster as the size guide for a matching set.\nPerfect inspiration for a cozy tea corner. #MacrameCoasters #BeginnerMacrame #HandmadeHome\nSave for later!",
    "content": "<p>Some of the most satisfying craft projects are the ones you use every day. A small stack of ivory macrame coasters brings texture to a coffee table, makes a tea break feel considered, and gives you a manageable way to practice consistent knotting. The square center keeps the look orderly, while short fringe softens two opposite edges.</p><p>This design is especially appealing beside simple ceramics and pale wood. It does not need colorful embellishments or complicated shapes. The interest comes from the repeated square-knot grid and the contrast between its compact center and loose cotton ends. Start with one practice coaster, then use what you learn to make a coordinated set.</p><div style=\"background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Key Takeaways</h3><ul style=\"margin:0;padding-left:20px;\"><li>Keep the cup-supporting area flat and appropriately sized.</li><li>Use consistent cord and tension across a matching set.</li><li>Practice alternating square knots on a small sample.</li><li>Trim fringe gradually with a simple paper guide.</li><li>Treat open knotwork as decorative, not waterproof.</li></ul></div><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">A small project with useful lessons</h2><p>A coaster lets you see the effects of tension quickly. On a large wall hanging, a slightly uneven row can disappear among many details. On a small square, the edges reveal it immediately. That makes the project a useful practice piece rather than just a way to fill spare cord.</p><p>The flat shape also encourages careful finishing. A coaster should sit comfortably on the table and support the base of your cup. Thick decorative bumps, uneven corners, or a tightly curled center can make it less pleasant to use. Keep the main surface simple and reserve the softer texture for the fringe.</p><p>Because each piece is small, you can experiment without committing to a large quantity of material. Try a sample in your chosen cord, compare a closer knot spacing with a slightly more open grid, and test both under the cup you use most often. The best choice is the one that looks good and sits steadily.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Choose cord for texture and function</h2><p>Cotton cord gives the pale, tactile finish seen in these coasters. Single-twist cord can produce soft brushed ends, while plied cord creates a more defined knot texture before it is separated for fringe. Keep the material and thickness consistent across a set so the finished pieces behave similarly.</p><p>A very chunky cord can look beautiful but create a bumpy surface. Fine cord gives a more delicate result, though it takes more knots to fill the same area. Before cutting several lengths, tie a few square knots, lay the sample flat, and set an empty cup on it. Notice whether the base rests evenly or rocks between raised knots.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Gather your supplies</h3><ul><li>Cotton cord from the same spool for a coordinated set.</li><li>A tape measure or ruler and sharp craft scissors.</li><li>A clipboard, knotting board, or protected working surface.</li><li>A temporary support cord or removable mounting method.</li><li>A comb for separating and tidying fringe.</li><li>A paper template and the cup you plan to use.</li></ul><p>Keep the working area clear enough to spread out the ends. Even a small project becomes frustrating if the cords catch on other supplies. Good lighting makes it easier to distinguish the path of each half knot, especially when all the strands are the same ivory color.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Decide what size you actually need</h3><p>Measure the base of your cup and allow a visible margin of knotted fabric around it. The fringe is decorative space, not the main support area. A coaster that looks generous when measured from fringe tip to fringe tip may still have a center too small for a wide mug.</p><p>Draw the planned knotted center on paper and place the cup inside the outline. This gives a practical reference for width and height. If you are making a gift, aim for an everyday cup size rather than a tiny espresso cup unless you know that is what the recipient uses.</p><p style=\"background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;\"><strong>Maker tip:</strong> Test the usable center, not the overall fringe width. A cup should rest entirely on the stable knotted area, with enough room that normal placement does not push its base onto loose ends.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Make a sample and cutting plan</h2><p>The exact cutting length depends on cord thickness, knot spacing, and the number of rows. Rather than relying on a universal length, knot a short sample and measure the material it consumes. Add enough for your temporary mounting, the finished center, and fringe at both ends.</p><p>For a square-knot grid, plan a hanging-end count that works in groups of four. Remember that a folded cord creates two ends. A staggered row uses pairs from neighboring groups and may leave outside ends unused for that row. Draw a few rows on paper so the edge sequence makes sense before you begin.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Choose a removable mounting method</h3><p>A coaster needs to lie flat, so a permanent dowel is not part of the finished piece. You can work from a temporary support cord or use a knotting board arrangement suitable for your pattern. Keep enough free length above the first row to create the upper fringe after removing the support.</p><p>Follow the release method for the mounting technique you select. Test it on a few strands first. Some attachments are easy to undo after the first row is secure; others leave a visible looped edge. Decide whether that edge suits your design instead of discovering it only when the coaster is complete.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Build an even square-knot grid</h2><p>Take four ends and treat the middle two as fillers. The outside cords do the wrapping. Begin a half knot by taking the left outer cord across the front of the fillers and under the right outer cord. Pass the right cord behind the fillers and through the loop on the left, then tighten gently.</p><p>Complete the square knot with the mirrored movement starting from the right. Both halves are needed for a flat knot. If every half begins on the same side, the work tends to spiral. Check the appearance of the first few knots before repeating the movement across the entire row.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Alternate the rows carefully</h3><p>For the next row, use two ends from one square-knot group and two from its neighbor. This shifts the knot centers and creates a connected grid. Depending on the layout, you will leave a pair of ends at each outer edge unworked in that row, then bring them back into the following full row.</p><p>Keep the gaps modest and consistent. An airy grid can look lovely, but wide openings reduce the continuous surface under a cup. Compare the sample with the desired use. If the cup base catches or tilts, tighten the spacing or choose a denser tested pattern before making the rest of the set.</p><h4 style=\"font-size:20px;line-height:1.4;margin:22px 0 12px;color:#334155;font-weight:700;background:#f8fafc;padding:10px 14px;border-radius:8px;\">Check every few rows</h4><p>Lay the work flat without stretching it and compare it with your paper outline. Measure at the top, middle, and bottom. If the width is gradually narrowing, the later knots may be tighter than the earlier ones. If one side is growing longer, check whether you have skipped an edge group or changed the row spacing.</p><p>Adjust the recent rows while they are still easy to undo. Pulling on the finished square to force it into shape may temporarily hide an issue but does not correct inconsistent knot placement. A steady rhythm and frequent short checks are usually more effective than trying to fix everything at the end.</p><div style=\"background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Why This Matters</h3><ul style=\"margin:0;padding-left:20px;\"><li>A coaster is a practical tension sample: flatness matters as much as neat knots.</li><li>Testing one finished piece helps you improve the whole set before repeating it.</li></ul></div><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Finish the edges and fringe</h2><p>Once the center is the intended size, secure the final row according to your pattern. Make sure the last knots are properly seated and cannot simply slide off the ends during ordinary handling. Release the temporary support carefully, keeping the upper edge organized as you work across it.</p><p>Comb the fringe from the tips toward the knots in small sections. If the cord is plied, untwist it first rather than forcing the comb through intact strands. Hold the edge of the knotted center while brushing so the pulling force does not distort the final row.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Use a template for matching ends</h3><p>Set the coaster on a protected flat surface and place a paper guide over the center. Mark a consistent fringe allowance on both sides, then make a conservative first cut. Turn the piece around to compare the edges from another angle. Refine gradually instead of chasing every stray fiber with a deep cut.</p><p>The fringe can be short and tidy or a little fuller and more relaxed. Keep it proportionate to the central square. Very long ends can catch beneath the cup or tangle with neighboring coasters in a stack. The photographed inspiration works because the fringe adds softness without overwhelming the useful center.</p><p style=\"background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;\"><strong>Maker tip:</strong> Finish the entire first coaster before cutting materials for the rest. You may decide to change the knot spacing, center size, or fringe length after seeing it beside your actual cup.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Make a coordinated set without chasing perfection</h2><p>Record the number of hanging ends, completed rows, and your final dimensions. Keep the first successful coaster nearby as a reference. Match the structure and tension rather than measuring every individual knot. Small natural differences are part of the appeal, but the pieces should feel related when placed together.</p><p>Use cord from the same batch where possible, since shades of natural cotton can vary. If you want a mixed set, make the variation intentional. For example, keep the same dimensions and fringe length while changing only the cord color. Changing size, color, and knot density at once can make the group feel accidental.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">A quiet color palette</h3><p>Ivory works well with speckled ceramics, warm wood, and terracotta linen. Muted sage or soft clay cord can add a little variety while preserving the calm look. Check colored cord for dye transfer according to its care guidance, especially if the coasters may become damp from cold glasses.</p><p>Avoid attaching beads or bulky decorations to the cup-supporting area. If you want a distinctive touch, explore a different fringe outline or a contrasting edge in a tested pattern. The most successful variation keeps the surface level and comfortable to use.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Everyday use and care</h2><p>Macrame coasters add a soft layer beneath a cup, but open knotwork is not waterproof. Condensation or a spill can reach the furniture through gaps or damp cotton. Use an additional suitable protective layer if the tabletop needs reliable moisture protection, and wipe up spills promptly rather than leaving a wet coaster in place.</p><p>These are drink coasters, not tested trivets for cookware. Do not assume that a natural fiber makes them suitable for hot pans or baking dishes. Keep their everyday role simple: a neat resting place for cups and glasses, with attention to both the textile and the surface underneath.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Clean gently and dry flat</h3><p>Follow the cord supplier's instructions first. For a small mark, spot cleaning may be enough. Test an inconspicuous area, use a mild approach appropriate to the material, and avoid rubbing the fringe aggressively. If the whole piece needs washing, support its shape and avoid wringing the knotwork into a tight twist.</p><p>Lay the coaster flat to dry, reshaping it gently while damp if the material allows. Do not stack it until fully dry. Once dry, separate the fringe with your fingers and give it a light comb only if needed. Frequent hard brushing can create more fuzz than you want.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Turn the set into a thoughtful handmade gift</h2><p>Stack matching coasters with the fringe aligned and tie them loosely with a cotton ribbon. Add a short care note explaining the material, cleaning guidance, and the fact that the open weave is not a waterproof barrier. Practical information makes a handmade gift easier to enjoy confidently.</p><p>A ceramic cup or a favorite tea can complement the set, but the coasters can stand on their own. Photograph them in natural light before wrapping them. A simple overhead view shows the knot consistency and gives you a useful record if you want to make another matching piece later.</p><div style=\"background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">At a Glance</h3><ul style=\"margin:0;padding-left:20px;\"><li>Measure the cup base.</li><li>Count rows and record dimensions.</li><li>Keep fringe clear of the supporting center.</li><li>Dry fully before stacking.</li></ul></div><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Enjoy the everyday pleasure of something handmade</h2><p>Fringed square macrame coasters are a small project with a pleasing balance of repetition and detail. The central grid builds your confidence with square knots, while the finishing stage teaches you how much a careful trim can change the final appearance. A simple ivory palette lets those details shine.</p><p>Make one, use it, and notice what you would change before starting the next. With a stable center, even rows, and a tidy fringe, you can create a set that belongs naturally beside your favorite cup. Save your measurements and keep the first successful piece as the starting point for future makes.</p><div style=\"margin-top:28px;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Tags</h3><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Macrame Coasters</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Square Knots</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Beginner Macrame</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">DIY Table Decor</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Cotton Crafts</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Handmade Gifts</span></div>"

    "title": "Sage and Terracotta Macrame Leaves",

    "category": "Wall decor",
    "level": "Beginner friendly",
    "time": "A relaxed weekend",

    "alt": "Ivory, sage and terracotta macrame leaves with combed fringe hanging at varied heights from a natural branch.",
    "excerpt": "Try a softer take on wall decor with cotton leaves in ivory, sage, and terracotta. 🍃\n• Make a paper template before trimming the fringe.\n• Stagger the hanging heights for a relaxed arrangement.\nA lovely way to play with color and turn spare cord into something personal. #MacrameLeaves #FiberArt #DIYWallDecor\nSave for later!",
    "content": "<p>A trio of macrame leaves can bring a surprising amount of warmth to a plain wall. Ivory, muted sage, and dusty terracotta create a gentle color story, while combed cotton fringe gives each leaf a soft outline. Suspended from a natural branch at slightly different heights, the shapes feel coordinated without looking rigid.</p><p>This is a rewarding project for anyone who enjoys shaping and finishing as much as knotting. The central spine gives the leaf its structure, but the brushing and trimming create its character. You can begin with a single small leaf, learn how your cord separates, and then make a group that suits your own space.</p><div style=\"background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Key Takeaways</h3><ul style=\"margin:0;padding-left:20px;\"><li>Choose cord that separates into a soft, brushable fringe.</li><li>Make one leaf before preparing the full set.</li><li>Use a paper template to guide the silhouette.</li><li>Check the shape while hanging, not only while flat.</li><li>Balance ivory, sage, and terracotta with varied hanging heights.</li></ul></div><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Read the design through shape and texture</h2><p>The leaves have three main visual features: a defined center line, soft fibers spreading to either side, and a tapered point. The knotted spine creates a small raised ridge that catches the light. Around it, the combed fringe forms a broad surface with enough texture to remain interesting even in one color.</p><p>The natural branch adds a contrasting line across the top. Its uneven surface makes the carefully shaped leaves feel more relaxed. A smooth dowel would produce a cleaner, more geometric result, so the choice of support can change the mood even when the leaves themselves stay exactly the same.</p><p>Varying the hanging heights gives the arrangement movement. The lower center leaf draws the eye gently downward, while the outer leaves balance it. This does not require exact symmetry. Aim for a comfortable distribution of color, size, and empty space rather than three objects placed at mechanically identical intervals.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Choose a simple palette</h3><p>Ivory acts as the lightest note, sage adds a quiet green, and terracotta brings warmth. Together, they work well with cream walls, pale wood, and natural fabrics. You can use equal-sized leaves to let color lead, or make one leaf slightly longer to create a focal point.</p><p>If you are changing the palette, keep one clear relationship between the colors. Three muted shades can feel cohesive even when they come from different color families. A very bright accent will attract more attention, so place it deliberately instead of expecting it to blend into an otherwise subdued arrangement.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Select cord that will brush out</h2><p>Single-twist cotton is a practical starting point for a soft, combed leaf. Its fibers can usually be separated into a full fringe without first unbraiding a complex structure. Plied cotton may also work, but you will need to separate the strands before brushing. Braided cord generally creates a different result.</p><p>Buy a small amount or test a leftover piece before committing to every leaf. Some cords shed more than others, and different thicknesses create different levels of fullness. The color may also appear lighter after brushing because the separated fibers catch more light. A finished sample tells you more than the spool alone.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Materials for a small wall arrangement</h3><ul><li>Cotton cord in ivory, sage, and terracotta, or a palette you prefer.</li><li>A smooth, dry branch or wooden dowel.</li><li>Sharp scissors and a tape measure.</li><li>A comb and a protected flat work surface.</li><li>Paper or card for a reusable leaf template.</li><li>Optional suitable backing material for leaves that need more support.</li></ul><p>Keep each color in a separate small bundle while you prepare the pieces. Loose fibers can migrate between piles as you brush, especially with a pale ivory cord next to a darker shade. A quick clean of the work surface between colors helps the final edges look fresh and intentional.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Plan the leaf before cutting the cord</h2><p>Draw a leaf outline on paper with a rounded shoulder, a gradual taper, and a clear point. Fold the paper along the intended center line before cutting if you want a symmetrical template. Open it and check whether the shape feels too wide, too narrow, or too pointed for the look you want.</p><p>The template describes the final outline, not the initial cord lengths. Side strands need enough extra length for the attachment knot, brushing, and trimming. The center cord also needs an allowance for the hanging loop and the lower point. Start generously on a small sample, then record the lengths that work.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Build one leaf first</h3><p>A single test leaf helps you answer several questions at once. Does the cord brush smoothly? Is the spine firm enough? Does the leaf hold its shape when lifted? Do you prefer a fuller shoulder or a narrower profile? These decisions are easier before you have prepared all the materials for three large pieces.</p><p>Keep the template, strand count, and measurements with the sample. If your final set uses equal-sized leaves, this becomes the reference for every color. If you want different sizes, enlarge or reduce the template deliberately and adjust the side strands accordingly rather than simply trimming one leaf shorter at the end.</p><p style=\"background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;\"><strong>Maker tip:</strong> Leave more fringe than the final outline requires. It is easy to remove cotton after brushing, but a short side strand can leave a hollow in the edge that is difficult to disguise.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Create the center spine</h2><p>Fold a longer cord to create a loop at the top and two ends running down the center. Secure the loop to your working surface without crushing the fibers. This center pair becomes the support around which the side strands are attached. Keep it straight as you work so the finished leaf does not lean unintentionally.</p><p>There are several ways to build a macrame leaf, and they produce different center textures. A paired-loop attachment is a useful beginner option, while other patterns use repeated knots to create a more pronounced braided spine. Choose one tested sequence and repeat it consistently. Mixing methods halfway down changes both the width and the texture.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">A paired-loop attachment to practice</h3><p>Fold two short side cords in half. Place the first folded piece horizontally beneath the center cords with its loop on the left. Lay the second folded piece in the opposite direction above the center, passing its folded loop through the first loop. Feed the two free ends of the first piece through the second loop.</p><p>Pull the side ends outward gently so the two folded pieces interlock around the center pair. Check that the connection grips the center rather than sitting as a loose knot beside it. Practice the movement with contrasting scrap colors if the path is hard to follow, then return to the single-color cord for the leaf.</p><p>Repeat with additional pairs, alternating the starting side if your selected pattern calls for it. Slide each connection neatly against the previous one while keeping the center straight. The aim is a continuous spine with evenly distributed side strands, not a cluster of very tight knots separated by large gaps.</p><h4 style=\"font-size:20px;line-height:1.4;margin:22px 0 12px;color:#334155;font-weight:700;background:#f8fafc;padding:10px 14px;border-radius:8px;\">Keep the lower end secure</h4><p>Finish the center according to your chosen pattern so the side attachments cannot slide off during handling. Leave enough center cord to blend into the pointed tip after brushing and trimming. Check the lower connection before cutting anything short. A tidy outline will not compensate for a spine that loosens when the leaf is lifted.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Brush the cotton patiently</h2><p>Lay the leaf flat and support the center with your hand. Separate visible twists with your fingers first, then work the comb from the outer tips inward in small sections. The fibers should gradually spread into a soft fan. Avoid dragging the comb forcefully through a knot or pulling an entire side at once.</p><p>Brush both sides evenly and pause to check the spine. If one edge has become much fuller, the opposite side may simply need more separation rather than more cord. Remove loose shed fibers from the work surface so they do not become tangled back into the leaf.</p><div style=\"background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Why This Matters</h3><ul style=\"margin:0;padding-left:20px;\"><li>The silhouette comes from both knot placement and finishing.</li><li>Brushing can change the width, color impression, and density of the leaf.</li><li>A sample helps you decide whether backing is needed.</li></ul></div><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Shape the shoulder and point</h3><p>Place the paper template over the brushed leaf, aligning its center with the spine. Make an initial cut outside the template line rather than directly against it. Remove the template, brush again, and check the outline. Cotton shifts as it separates, so a second light pass often produces a cleaner result.</p><p>Work from the broad shoulder toward the point with small cuts. Keep the scissors level with the work surface and avoid lifting the fringe while trimming. Lifting changes where the fibers fall and can create an uneven edge once you lay them down again.</p><p style=\"background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;\"><strong>Maker tip:</strong> Step back before the final trim. Slight natural differences between the leaves can look beautiful, but repeated corrective cuts can make the whole set smaller than you intended.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Help the leaves keep their shape</h2><p>Small leaves made with suitable cord may hang well without added support. Larger or very soft leaves can droop, curl, or lose their outline when moved. Lift the finished sample before deciding whether the whole set needs help. A leaf that looks perfect flat on the table may behave differently on the wall.</p><p>One option is a discreet backing cut slightly smaller than the leaf outline. Choose a color that blends with the cotton and attach it with a method appropriate to the materials. Test the attachment on scraps first so it does not seep through, harden the visible fibers, or create a dark patch.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Be selective with stiffening products</h3><p>If you choose a fabric stiffener, follow the product directions and test it on spare cord. It can change the feel, color, and appearance of the fringe. Use only as much as needed for the desired support and let the leaf dry fully in its intended shape before hanging it.</p><p>Stiffening is a finishing choice, not an automatic requirement. The soft movement of untreated cotton can be part of the charm. For a small ornament, you may prefer a slightly relaxed edge to a rigid silhouette. Let the intended display and your sample guide the decision.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Arrange the leaves on a branch</h2><p>Lay the branch and leaves on a table before tying the final hanging loops. Move the pieces until the color order feels balanced. A pale leaf near a darker wall edge can brighten that side, while the terracotta leaf may naturally attract more attention. Give each outline enough space to remain distinct.</p><p>Adjust the loop lengths to vary the drop. Letting the center leaf sit lower creates a gentle downward rhythm, but an asymmetrical arrangement can be equally appealing. Check that the leaves do not overlap so heavily that their carefully trimmed sides disappear. The spaces between them are part of the design.</p><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Prepare the wooden support</h3><p>Use a branch that is dry, clean, and free of sharp points or loose bark that could snag the cotton. Smooth rough areas as needed before adding the leaves. A branch with a slight curve can look lovely, but check how it balances from its suspension points so it does not rotate unexpectedly.</p><p>Choose wall hardware suitable for the completed piece and the surface. Keep the display away from damp areas and places where the loops could be pulled. A quiet wall near a reading chair, craft shelf, or entry table gives the colors room to be appreciated without requiring an elaborate setting.</p><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Care, storage, and seasonal changes</h2><p>Dust gently with a soft brush, supporting the leaf so the outline does not fold under your hand. Use fingers to separate a few disturbed fibers before reaching for the comb. Frequent aggressive brushing can remove material and slowly change the shape you worked to create.</p><p>If you pack the arrangement away, store the leaves flat with clean paper between them. Avoid crushing the fringe under heavier objects. You can reuse the same branch with a different color trio later, or display one leaf on its own when you want a smaller accent. Keep the original templates so replacements remain coordinated.</p><div style=\"background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">At a Glance</h3><ul style=\"margin:0;padding-left:20px;\"><li>Keep the center spine straight.</li><li>Brush from the tips inward.</li><li>Trim in small passes.</li><li>Leave space between the leaves.</li></ul></div><h2 style=\"font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;\">Let simple shapes bring warmth to your walls</h2><p>Sage and terracotta macrame leaves combine approachable knotting with a satisfying finishing process. The colors create a calm foundation, the central spines add structure, and the brushed edges make the arrangement feel soft. A natural branch brings all three pieces together without making them overly formal.</p><p>Start with one test leaf and let it teach you how the cotton behaves. Brush gently, trim gradually, and arrange the finished pieces with room around them. The result is a personal piece of fiber art that makes good use of simple materials and rewards the care you put into every small detail.</p><div style=\"margin-top:28px;\"><h3 style=\"font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;\">Tags</h3><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Macrame Leaves</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Macrame Feathers</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">DIY Wall Hanging</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Sage Decor</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Terracotta Decor</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Cotton Fiber Art</span><span style=\"display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;\">Beginner Crafts</span></div>"

const pages = {"about":{"title":"A little slower. A little more handmade.","content":"<p>Welcome to <strong>Macrame Diy Ideas</strong>, a small collection of projects for a warmer, more personal home.</p><p>Here you will find cotton textures, earthy colors, and ideas worth spending an afternoon with. Explore wall hangings, plant hangers, everyday coasters, and playful leaf ornaments.</p><h2>Made for curious hands</h2><p>Our guides explain materials, design choices, and finishing techniques. Start small, make a sample, and adapt each idea to your space. Decorative project images are digitally generated inspiration; they are not photographs of tested finished patterns.</p><p>Enjoy the process. A few thoughtful knots can make something lovely.</p>"},"privacy":{"title":"Privacy Policy","content":"<p><strong>Page updated: September 30, 2026</strong></p><h2>This website</h2><p>This version of Macrame Diy Ideas contains static articles and images. Its page code does not include analytics, advertising scripts, tracking pixels, cookies, account registration, or a contact form. Project filtering happens in your browser and is not sent to a server by this page.</p><h2>Hosting and email</h2><p>The service hosting the website may process technical request information, such as IP addresses and requested files, under its own privacy practices. Using an email link opens your chosen email application. Information you send by email is handled by the recipient and the email services involved.</p><h2>Changes</h2><p>If advertising, analytics, forms, or other services are added, this notice will need to be updated to describe those services and their data use.</p><p>For questions, use the contact information on our <a href=\"#contact\">Contact page</a>.</p>"},"terms":{"title":"Terms of Use","content":"<p><strong>Page updated: September 30, 2026</strong></p><h2>Using these ideas</h2><p>Macrame Diy Ideas shares creative inspiration and general craft guidance. You are welcome to use the ideas for your own projects. The articles are design guides rather than tested, counted patterns, and finished results will vary with materials and technique.</p><h2>Project decisions</h2><p>Check your materials and follow the instructions provided with tools, cords, finishes, and mounting hardware. For plant hangers, use a tested pattern and supports appropriate to the complete load. Decorative images do not establish dimensions, strength, or performance.</p><h2>Content and links</h2><p>Please link to an article when sharing it rather than republishing the full text or image collection. Contact us to discuss other uses. Any external services operate under their own terms.</p><p>Questions about this page can be sent through our <a href=\"#contact\">Contact page</a>.</p>"},"contact":{"title":"Let’s talk about your next make.","content":"<p>Have a question about a project, a suggestion for the collection, or a note about this website? Send an email using the link below.</p><a class=\"button\" href=\"mailto:contact@carolynadamsulo-creator.github.io\">Send an email ↗</a><p class=\"contact-address\">contact@carolynadamsulo-creator.github.io</p><p>For project questions, include the article title, your cord type, and the step you are working on so your question has useful context.</p>"}};

function renderHome(){document.title='Macrame Diy Ideas | A little more handmade';app.innerHTML='<section class="hero"><div class="hero-copy"><span class="eyebrow">The joy of making, one knot at a time</span><h1>Slow down.<br>Make something<br><em>lovely.</em></h1><p>A little cord, a little curiosity. Discover thoughtful macrame ideas for a home that feels like you.</p><a class="button" href="#projects">Find your next project <span aria-hidden="true">↗</span></a><div class="hero-note"><span aria-hidden="true">✳</span><span>Simple materials. Beautiful possibilities.</span></div></div><div class="hero-visual"><a href="#'+posts[0].id+'"><img src="'+imageSrc(posts[0])+'" alt="'+esc(posts[0].alt)+'" width="700" height="610" fetchpriority="high"><div class="image-label"><strong>The weekend project</strong><span>Meet your next wall hanging ↗</span></div></a></div></section><div class="principles"><span>Natural textures</span><span>Ideas for every skill level</span><span>Made with your own hands</span></div><section class="collection" id="projects" aria-labelledby="collection-title"><div class="section-heading"><div><span class="eyebrow">A collection for curious hands</span><h2 id="collection-title">Find your next little joy.</h2></div><p id="result-count" role="status" aria-live="polite"></p></div><div class="filters" role="group" aria-label="Filter projects">'+['All ideas','Wall decor','Plant hangers','Everyday makes'].map(c=>'<button class="filter" type="button" data-category="'+c+'" aria-pressed="'+(c===selectedCategory)+'">'+c+'</button>').join('')+'</div><div class="grid" id="post-grid"></div></section><aside class="about-strip"><img src="./assets/blog-avatar.png" alt="" width="78" height="78"><div><h2>A home with a handmade heart.</h2><p>We believe the best things take a little time. Settle in, untangle your cord, and enjoy the small pleasure of making something yourself.</p></div><a href="#about">A little about us ↗</a></aside>';renderGrid();document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{selectedCategory=b.dataset.category;renderGrid()}))}

function route(focus=false){let id;try{id=decodeURIComponent(location.hash.slice(1))}catch{id='not-found'}if(!id||id==='home'||id==='projects'||id==='main-content'){renderHome()}else if(Object.prototype.hasOwnProperty.call(pages,id)){const p=pages[id];document.title=p.title+' | Macrame Diy Ideas';app.innerHTML='<section class="reading page-shell"><a class="back" href="#home">← Back to home</a><header class="article-header"><span class="eyebrow">Macrame Diy Ideas</span><h1>'+p.title+'</h1></header><div class="article-body">'+p.content+'</div></section>'}else{const p=posts.find(x=>x.id===id);if(p)renderPost(p);else{document.title='Page not found | Macrame Diy Ideas';app.innerHTML='<section class="reading page-shell"><h1>This thread leads somewhere else.</h1><p>We could not find that page. There are still plenty of lovely things to make.</p><a class="button" href="#home">Back to the collection</a></section>'}}document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===id||(a.dataset.nav==='home'&&['','projects','main-content'].includes(id));if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(focus)document.getElementById('main-content').focus({preventScroll:true});if(id==='projects')requestAnimationFrame(()=>document.getElementById('projects').scrollIntoView({behavior:'instant'}));else if(focus)window.scrollTo({top:0,behavior:'instant'})}
